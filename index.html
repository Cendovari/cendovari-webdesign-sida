  &lt;div class=&quot;ni-process-steps&quot;&gt;
    &lt;details open&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span&gt;01&lt;/span&gt;&lt;h3&gt;Vi hittar riktningen.&lt;/h3&gt;&lt;i data-lucide=&quot;plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/summary&gt;&lt;p&gt;Vi börjar med verksamheten och vad besökaren ska kunna hitta och göra på hemsidan.&lt;/p&gt;&lt;div class=&quot;st-step-delivery&quot;&gt;&lt;span&gt;Du bidrar med&lt;/span&gt;&lt;p&gt;Dina önskemål och det material du har.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span&gt;02&lt;/span&gt;&lt;h3&gt;Du får se förslaget.&lt;/h3&gt;&lt;i data-lucide=&quot;plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/summary&gt;&lt;p&gt;Struktur, färger och innehåll tar form i en förhandsvisning. Vi går igenom din feedback och finjusterar tillsammans.&lt;/p&gt;&lt;div class=&quot;st-step-delivery&quot;&gt;&lt;span&gt;Du får&lt;/span&gt;&lt;p&gt;En konkret design att se, prova och lämna synpunkter på.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span&gt;03&lt;/span&gt;&lt;h3&gt;Vi gör sidan redo.&lt;/h3&gt;&lt;i data-lucide=&quot;plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/summary&gt;&lt;p&gt;Efter ditt godkännande kontrollerar vi sidan, hjälper till med publicering och visar hur du uppdaterar den.&lt;/p&gt;&lt;div class=&quot;st-step-delivery&quot;&gt;&lt;span&gt;Du tar med dig&lt;/span&gt;&lt;p&gt;Din WordPress-hemsida och en genomgång av hur du ändrar text och bilder.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

        &lt;section class=&quot;ni-faq&quot; aria-labelledby=&quot;master-faq-heading&quot;&gt;
  &lt;div class=&quot;ni-faq-intro&quot;&gt;&lt;p class=&quot;ni-eyebrow&quot;&gt;Bra att veta&lt;/p&gt;&lt;h2 id=&quot;master-faq-heading&quot;&gt;Innan vi&lt;br&gt;börjar.&lt;/h2&gt;&lt;p&gt;Några svar på vägen till en hemsida som känns rätt för ditt företag.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ni-faq-list&quot;&gt;
    &lt;details open&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span&gt;Vad behöver jag ha klart?&lt;/span&gt;&lt;i data-lucide=&quot;plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/summary&gt;&lt;div class=&quot;ni-faq-answer&quot;&gt;&lt;p&gt;Börja med att berätta om verksamheten och vad du vill få ut av hemsidan. Har du logotyp, bilder eller text kan du ta med dem.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span&gt;Får jag se designen före publicering?&lt;/span&gt;&lt;i data-lucide=&quot;plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/summary&gt;&lt;div class=&quot;ni-faq-answer&quot;&gt;&lt;p&gt;Ja. Du får en förhandsvisning och kan lämna feedback. Vi finjusterar tillsammans innan du godkänner publiceringen.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span&gt;Kan ni göra om en befintlig hemsida?&lt;/span&gt;&lt;i data-lucide=&quot;plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/summary&gt;&lt;div class=&quot;ni-faq-answer&quot;&gt;&lt;p&gt;Ja. Vi går igenom vad som fungerar idag och vad du vill förbättra. Sedan föreslår vi ett upplägg för design, innehåll och funktioner.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span&gt;Kan jag uppdatera hemsidan själv?&lt;/span&gt;&lt;i data-lucide=&quot;plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/summary&gt;&lt;div class=&quot;ni-faq-answer&quot;&gt;&lt;p&gt;Ja. Med WordPress kan du uppdatera text och bilder. Vi visar hur du gör när hemsidan är klar.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span&gt;Vad kostar en hemsida?&lt;/span&gt;&lt;i data-lucide=&quot;plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/summary&gt;&lt;div class=&quot;ni-faq-answer&quot;&gt;&lt;p&gt;Omfattning, innehåll och funktioner påverkar priset. Berätta vad du behöver så tar vi fram ett förslag för ditt projekt.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span&gt;Vilka löpande kostnader finns?&lt;/span&gt;&lt;i data-lucide=&quot;plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/summary&gt;&lt;div class=&quot;ni-faq-answer&quot;&gt;&lt;p&gt;Domän, webbhotell och eventuella tillägg kan ge löpande kostnader. Vi stämmer av vilka delar som behövs för ditt projekt och hur de ska ordnas.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

        &lt;section class=&quot;ni-home-contact&quot; data-at-depth=&quot;closing&quot;&gt;&lt;p class=&quot;ni-eyebrow&quot;&gt;Vi börjar med ett samtal&lt;/p&gt;&lt;h2&gt;Din nästa hemsida&lt;br&gt;börjar här.&lt;/h2&gt;&lt;p class=&quot;ni-contact-lead&quot;&gt;En ny start eller ett bättre uttryck för det du redan gör. Berätta om din verksamhet, så börjar vi där.&lt;/p&gt;&lt;div class=&quot;ni-contact-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;ni-pill ni-primary-cta cursor-interaction&quot; data-nav=&quot;contact&quot;&gt;Berätta om ditt projekt &lt;span class=&quot;ni-cta-arrow&quot; aria-hidden=&quot;true&quot;&gt;&lt;i data-lucide=&quot;arrow-up-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;/button&gt;&lt;span&gt;support@cendovari.com&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;ni-contact-reassurance&quot;&gt;&lt;i data-lucide=&quot;check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; Du får se designen före publicering.&lt;/p&gt;&lt;div class=&quot;at-closing-depth&quot; data-at-depth-layer=&quot;closing&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;ni-shard ni-shard-contact&quot; aria-hidden=&quot;true&quot;&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;

@import url(&#x27;https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&amp;display=swap&#x27;);
#cv-crest{--ni-paper:#e6e7ef;--ni-ink:#1d212a;--ni-muted:#4b5160;--ni-line:#a2a7b54d;--ni-light:#fff;--ni-glass:#f5f6fa;--ni-peach:#f2dcd6;--ni-lilac:#dcdbed;font-family:Arial,Helvetica,sans-serif;color:var(--ni-ink);color-scheme:light;width:100%;background:transparent}
#cv-crest *{box-sizing:border-box;color:inherit}
#cv-crest [hidden]{display:none!important}
#cv-crest button,#cv-crest input,#cv-crest textarea{font:inherit}
#cv-crest button{color:inherit}
#cv-crest button{border:0;background:transparent}
#cv-crest h1,#cv-crest h2,#cv-crest h3,#cv-crest p{margin:0;font-weight:400;color:inherit}
#cv-crest svg{width:18px;height:18px;flex-shrink:0;stroke-width:1.5}
#cv-crest .ni-preview-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:4px 4px 13px;font-size:12px;color:var(--muted-foreground)}
#cv-crest .ni-preview-bar button{border:1px solid var(--border);color:var(--foreground);border-radius:30px;padding:8px 13px;min-height:36px;font-size:12px}
#cv-crest .ni-site{background:var(--ni-paper);color:var(--ni-ink);position:relative;overflow:clip;isolation:isolate}
#cv-crest .ni-atmosphere{position:absolute;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(120deg,#e4e6ed,#e8e9f1 42%,#e1e2ec 100%);pointer-events:none}
#cv-crest .ni-light{position:absolute;inset:-5%;background-repeat:repeat-y;background-size:100% 1050px;opacity:.8;will-change:transform}
#cv-crest .ni-light-a{background-image:radial-gradient(ellipse 22% 260px at 67% 36%,#f0d6cf9c,transparent 85%),radial-gradient(ellipse 38% 300px at 22% 86%,#d7d5ebba,transparent 78%)}
#cv-crest .ni-light-b{background-image:radial-gradient(ellipse 16% 260px at 78% 71%,#fffaf8cc,transparent 90%),radial-gradient(ellipse 27% 360px at 42% 37%,#f9f9fb70,transparent 90%);opacity:.65}
#cv-crest .ni-light-c{background-image:radial-gradient(ellipse 22% 300px at 90% 23%,#d2d5e8aa,transparent 90%),radial-gradient(ellipse 31% 380px at 18% 30%,#e9e4f4a6,transparent 90%);opacity:.65}
#cv-crest.ni-motion .ni-light-a{animation:ni-atmosphere-a 23s ease-in-out infinite alternate}
#cv-crest.ni-motion .ni-light-b{animation:ni-atmosphere-b 29s ease-in-out infinite alternate}
#cv-crest.ni-motion .ni-light-c{animation:ni-atmosphere-a 31s ease-in-out infinite alternate-reverse}
#cv-crest .ni-header{display:flex;align-items:center;justify-content:space-between;gap:22px;padding:24px 32px;position:relative;z-index:5}
#cv-crest .ni-brand{display:flex;align-items:center;gap:8px;padding:0;min-height:38px}
#cv-crest .ni-brand img{width:165px;height:auto;display:block}
#cv-crest .ni-brand span{font-size:11px;align-self:center;letter-spacing:.025em}
#cv-crest .ni-header nav{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
#cv-crest .ni-header nav button{text-transform:uppercase;font-size:11px;letter-spacing:.035em;padding:10px 0;min-height:38px;position:relative}
#cv-crest .ni-header nav button::after{content:&#x27;&#x27;;position:absolute;left:0;bottom:5px;right:0;height:1px;background:var(--ni-ink);transform:scaleX(0);transform-origin:left;transition:transform .25s}
#cv-crest .ni-header nav button:hover::after,#cv-crest .ni-header nav button[aria-current=page]::after{transform:scaleX(1)}
#cv-crest .ni-nav-contact{display:flex;align-items:center;gap:7px}
#cv-crest .ni-eyebrow{font-size:11px;line-height:1.5;letter-spacing:.09em;text-transform:uppercase}
#cv-crest .ni-hero{position:relative;min-height:610px;padding:45px 32px 26px}
#cv-crest .ni-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#cv-crest .ni-hero&gt;*:not(canvas),#cv-crest .ni-about-hero&gt;*:not(canvas){position:relative;z-index:1}
#cv-crest .ni-hero h1{font-size:clamp(48px,7.8vw,84px);line-height:.99;letter-spacing:-.055em;text-transform:uppercase;margin:24px 0 58px;max-width:950px}
#cv-crest .ni-hero h1 span{display:inline-block;margin-left:24%}
#cv-crest .ni-hero-bottom{display:grid;grid-template-columns:1fr 1.18fr 1.06fr;gap:26px;align-items:start}
#cv-crest .ni-quiet{font-size:12px;line-height:1.6}
#cv-crest .ni-hero-bottom p{font-size:14px;line-height:1.5;max-width:290px}
#cv-crest .ni-pill{display:inline-flex;align-items:center;justify-content:space-between;gap:16px;background:var(--ni-ink);color:var(--ni-light);border-radius:30px;padding:13px 20px;min-height:44px;font-size:12px;white-space:nowrap;transition:transform .25s,background .25s}
#cv-crest .ni-pill:hover{background:#404551;transform:translateY(-2px)}
#cv-crest .ni-scroll-note{display:flex;align-items:center;gap:10px;font-size:11px;margin-top:64px}
#cv-crest .ni-scroll-note svg{width:14px;height:14px}
#cv-crest .ni-section-label{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:30px 32px 0;font-size:11px;line-height:1.5;text-transform:uppercase;letter-spacing:.04em}
#cv-crest .ni-stage{position:relative;height:580px;perspective:1300px;overflow:hidden}
#cv-crest .ni-stage-title{position:absolute;inset:51px 32px auto;font-size:clamp(72px,11.6vw,118px);line-height:.96;letter-spacing:-.06em;text-transform:uppercase;color:var(--ni-ink);opacity:.94;z-index:0;transform:translateY(calc(var(--ni-scroll-lift,0px) * -.4))}
#cv-crest .ni-device-float{position:absolute;width:74%;max-width:720px;left:22%;top:118px;transform:translateY(var(--ni-scroll-lift,0px)) rotateX(calc(5deg + var(--ni-scroll-angle,0deg))) rotateY(-13deg) rotateZ(2deg);transform-style:preserve-3d;transition:left 1s cubic-bezier(.2,.7,.2,1),width 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1),top 1s cubic-bezier(.2,.7,.2,1);z-index:2}
#cv-crest .ni-device{position:relative;background:#20222a;padding:9px;border-radius:19px;box-shadow:0 26px 40px #383b4b20,0 3px 4px #ffffffab inset;transform-style:preserve-3d;transition:border-radius .8s,padding .8s}
#cv-crest .ni-screen-top{height:24px;background:#ececef;border-radius:10px 10px 0 0;display:flex;align-items:center;gap:4px;padding:0 10px;color:#777b88;font-size:9px;position:relative;overflow:hidden;transition:height .8s}
#cv-crest .ni-screen-top&gt;span{width:5px;height:5px;border-radius:50%;background:#bfc2cc}
#cv-crest .ni-screen-top&gt;div{position:absolute;left:39%;font-size:10px}
#cv-crest .ni-demo-site{background:#f2eee9;color:#29282a;border-radius:0 0 9px 9px;overflow:hidden;min-height:315px;transition:min-height 1s,border-radius .8s}
#cv-crest .ni-demo-nav{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;font-size:10px;white-space:nowrap}
#cv-crest .ni-demo-nav&gt;span:first-child{font-size:15px;letter-spacing:-.04em}
#cv-crest .ni-demo-dot{color:#75777e;font-size:24px;line-height:0}
#cv-crest .ni-demo-hero{display:grid;grid-template-columns:1fr 1fr;min-height:216px}
#cv-crest .ni-demo-copy{padding:12px 0 16px 24px;position:relative;z-index:1}
#cv-crest .ni-demo-kicker{font-size:9px;text-transform:uppercase;letter-spacing:.07em;display:block;margin-bottom:10px}
#cv-crest .ni-demo-copy h3{font-size:clamp(25px,4vw,40px);line-height:1.02;letter-spacing:-.05em;margin-bottom:13px;white-space:nowrap}
#cv-crest .ni-demo-copy p{font-size:10px;line-height:1.5;max-width:180px;margin-bottom:15px}
#cv-crest .ni-demo-cta{display:inline-flex;align-items:center;gap:10px;border-radius:20px;background:#29282a;color:#fff;padding:8px 11px;font-size:9px;white-space:nowrap}
#cv-crest .ni-demo-cta svg{width:11px;height:11px}
#cv-crest .ni-demo-art{position:relative;margin:0 14px 0 10px;overflow:hidden;background:linear-gradient(130deg,#d3cfc9,#efebe6 47%,#b5b4b4);min-width:0}
#cv-crest .ni-art-wall{position:absolute;background:linear-gradient(110deg,#f8f5f0,#ccc9c4);box-shadow:8px 10px 18px #29282919}
#cv-crest .ni-art-wall-a{height:140%;width:45%;left:12%;top:-16%;transform:rotate(-26deg)}
#cv-crest .ni-art-wall-b{height:110%;width:25%;right:14%;top:2%;transform:rotate(24deg);background:linear-gradient(120deg,#f1eeea,#a09f9e)}
#cv-crest .ni-art-floor{position:absolute;bottom:0;left:0;right:0;height:36%;background:linear-gradient(140deg,#c1bcb4,#ece7df);clip-path:polygon(0 80%,100% 0,100% 100%,0 100%)}
#cv-crest .ni-art-block{position:absolute;box-shadow:12px 13px 17px #29282924;background:linear-gradient(115deg,#fffaf5 0%,#fffaf5 58%,#c9c5bf 59%,#c9c5bf 100%);transform:skewY(-13deg)}
#cv-crest .ni-art-block-a{width:43%;height:30%;left:14%;bottom:14%}
#cv-crest .ni-art-block-b{width:30%;height:40%;right:8%;bottom:28%;background:linear-gradient(115deg,#909195 0%,#909195 58%,#585a60 59%,#585a60 100%)}
#cv-crest .ni-demo-footer{display:flex;justify-content:space-between;gap:10px;padding:14px 24px;border-top:1px solid #bbb9b033;font-size:9px;line-height:1.4}
#cv-crest .ni-device-base{position:absolute;left:-5%;right:-5%;bottom:-13px;height:15px;border-radius:2px 2px 28px 28px;background:linear-gradient(#c9cbd2,#eff0f4 35%,#b2b4c0 75%,#8b8d99);box-shadow:0 7px 12px #35364221;transition:opacity .45s,transform .7s}
#cv-crest .ni-device-base::after{content:&#x27;&#x27;;position:absolute;width:15%;height:4px;left:42%;top:0;background:#a1a3b0;border-radius:0 0 4px 4px}
#cv-crest .ni-device-shadow{position:absolute;width:82%;height:20px;left:7%;bottom:-70px;filter:blur(13px);background:#34374740;border-radius:50%;transform:rotateX(60deg);transition:width .7s,bottom .7s}

/* Shared reflected light. Existing layout, content and the pinned scene stay intact. */
#cv-crest{
  --master-ambient-x:0px;
  --master-ambient-y:0px;
  --master-ambient-counter:0px;
  --master-ambient-glow:0;
}
#cv-crest .ni-atmosphere .ni-light{
  animation:none!important;
  transition:none!important;
  will-change:auto;
}
#cv-crest .ni-atmosphere .ni-light-a{
  background-image:radial-gradient(ellipse 24% 300px at 70% 32%,#ffffffe0,transparent 85%),radial-gradient(ellipse 38% 330px at 22% 85%,#d2cfe77a,transparent 78%);
  transform:translate3d(var(--master-ambient-x),var(--master-ambient-y),0);
  opacity:calc(.72 + var(--master-ambient-glow));
}
#cv-crest .ni-atmosphere .ni-light-b{
  transform:translate3d(var(--master-ambient-counter),var(--master-ambient-y),0);
  opacity:.59;
}
#cv-crest .ni-atmosphere .ni-light-c{
  transform:translate3d(var(--master-ambient-x),calc(var(--master-ambient-y) * -.5),0);
  opacity:.56;
}
#cv-crest [data-at-depth-layer]{
  --master-material-x:0px;
  --master-material-glow:.2;
}
/* Light moves within the silver material; perspective and object geometry are unchanged. */
#cv-crest .st-prism-sheet-front::after{
  content:&quot;&quot;;
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(114deg,transparent 24%,#ffffff80 42%,#ffffffbe 45%,transparent 65%);
  background-size:150% 100%;
  background-position:calc(50% + var(--master-material-x,0px)) 50%;
  opacity:var(--master-material-glow,.2);
  transition:none!important;
}
#cv-crest .st-prism-face-a{
  background-size:145% 100%;
  background-position:calc(50% + var(--master-material-x,0px)) 50%;
  transition:none!important;
}
#cv-crest .st-prism-light{
  translate:var(--master-material-x,0px) 0;
  transition:none!important;
}
#cv-crest .st-about-art-material&gt;span{
  translate:calc(var(--master-material-x,0px) * .55) 0;
  transition:none!important;
}
#cv-crest .sg-picture-glint{
  translate:calc(var(--master-material-x,0px) * .45) 0;
}
#cv-crest .at-closing-depth .ni-shard&gt;div:first-child{
  background-size:150% 100%;
  background-position:calc(50% + var(--master-material-x,0px)) 50%;
  transition:none!important;
}
#cv-crest:not(.ni-motion){
  --master-ambient-x:0px!important;
  --master-ambient-y:0px!important;
  --master-ambient-counter:0px!important;
  --master-ambient-glow:0!important;
}
#cv-crest:not(.ni-motion) [data-at-depth-layer]{
  --master-material-x:0px!important;
  --master-material-glow:.2!important;
}
@media(max-width:540px){
  #cv-crest{
    --master-ambient-x:0px!important;
    --master-ambient-y:0px!important;
    --master-ambient-counter:0px!important;
    --master-ambient-glow:0!important;
  }
  #cv-crest [data-at-depth-layer]{
    --master-material-x:0px!important;
    --master-material-glow:.2!important;
  }
}
@media(prefers-reduced-motion:reduce){
  #cv-crest{
    --master-ambient-x:0px!important;
    --master-ambient-y:0px!important;
    --master-ambient-counter:0px!important;
    --master-ambient-glow:0!important;
  }
  #cv-crest [data-at-depth-layer]{
    --master-material-x:0px!important;
    --master-material-glow:.2!important;
  }
}

/* One signature, in the existing service form study only. Append after base CSS.
   C/V polygons are the original 207 x 143 logo geometry, normalized to percent.
   Integration: existing .ms-website-image (3 spans) and .ms-mobile-image (2).
   The decorative parent already has aria-hidden=&quot;true&quot;. No HTML/JS changes. */
#cv-crest .ms-services-art .ms-website-image,
#cv-crest .ms-services-art .ms-mobile-image {
  --lb-width:72px;
  --lb-height:49.74px;
  background:radial-gradient(ellipse at 50% 52%,#fafbff 0%,#e9edf5 44%,#dbe1ec 100%);
  isolation:isolate;
}
#cv-crest .ms-services-art .ms-mobile-image {
  --lb-width:44px;
  --lb-height:30.4px;
}
#cv-crest .ms-services-art .ms-website-image&gt;span,
#cv-crest .ms-services-art .ms-mobile-image&gt;span {
  display:block;
  position:absolute;
  left:50%;
  top:50%;
  width:var(--lb-width);
  height:var(--lb-height);
  border:0;
  transform:translate(-50%,-50%);
  opacity:.96;
  pointer-events:none;
  background:linear-gradient(112deg,#b7c2d58c 0%,#fafbff 43%,#c5cde2b3 70%,#fff 100%);
  clip-path:polygon(65.217% 0,22.222% 1.399%,0 47.552%,25.121% 100%,42.995% 100%,17.391% 48.252%,29.952% 22.378%,54.589% 22.378%);
}
#cv-crest .ms-services-art .ms-website-image&gt;span:nth-child(2),
#cv-crest .ms-services-art .ms-mobile-image&gt;span:nth-child(2) {
  left:50%;
  width:var(--lb-width);
  transform:translate(-50%,-50%);
  opacity:.96;
  background:linear-gradient(128deg,#fff 10%,#ced2e6bd 41%,#f8f8fe 66%,#b8c3d69e 100%);
  clip-path:polygon(32.367% 32.867%,48.309% 32.867%,65.700% 67.133%,83.575% 32.867%,100% 32.867%,65.700% 99.301%);
}
#cv-crest .ms-services-art .ms-website-image&gt;span:nth-child(n+3) {
  display:none;
}

      observer.disconnect();

    closeTooltip(false);
    lastPointerWasTouch = false;

      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);

        panel.hidden = id !== panelId;

          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);

    const tab = event.target?.closest?.(selector);

      return;

      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {

    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;

    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);

    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  const viewport = globalThis.visualViewport;
  let viewportFrame = 0;
  let settleFrame = 0;
  let reportedHeight = null;
  let resizing = false;
  let measurePort = null;
  const mobileShell = matchMedia('(max-width:820px), (max-width:1024px) and (max-height:500px)');
  const visibleHeight = () => Math.floor(viewport?.height || globalThis.innerHeight);
  const availableHeight = () => {
    const bodyStyle = getComputedStyle(document.body);
    const padding = (Number.parseFloat(bodyStyle.paddingTop) || 0) +
      (Number.parseFloat(bodyStyle.paddingBottom) || 0);
    return Math.max(0, Math.floor(visibleHeight() - padding));
  };
  const fitFrame = (available) => {
    if (reportedHeight == null) {
      frame.style.removeProperty('height');
      return;
    }
    if (available == null) available = availableHeight();
    frame.style.height = Math.min(Math.ceil(reportedHeight), available) + 'px';
  };
  const updateVisibleHeight = () => {
    viewportFrame = 0;
    document.documentElement.style.setProperty('--cv-visible-height', visibleHeight() + 'px');
    fitFrame();
    if (resizing) {
      settleFrame = requestAnimationFrame(() => {
        settleFrame = 0;
        resizing = false;
        measurePort?.postMessage({ type: 'measure' });
      });
    }
  };
  const queueVisibleHeight = () => { if (!viewportFrame) viewportFrame = requestAnimationFrame(updateVisibleHeight); };
  const resetVisibleHeight = () => {
    if (settleFrame) cancelAnimationFrame(settleFrame);
    settleFrame = 0;
    resizing = true;
    reportedHeight = null;
    document.documentElement.style.setProperty('--cv-visible-height', visibleHeight() + 'px');
    frame.style.removeProperty('height');
    queueVisibleHeight();
  };
  updateVisibleHeight();
  viewport?.addEventListener('resize', resetVisibleHeight, {passive:true});
  globalThis.addEventListener('resize', resetVisibleHeight, {passive:true});
  globalThis.addEventListener('pagehide', () => {
    if (viewportFrame) cancelAnimationFrame(viewportFrame);
    if (settleFrame) cancelAnimationFrame(settleFrame);
    viewportFrame = 0;
    settleFrame = 0;
  });
  globalThis.addEventListener('pageshow', resetVisibleHeight);
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  measurePort = channel.port1;
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        if (resizing) return;
        const available = availableHeight();
        // This demo's desktop content is a 700 px scroller plus its 56 px bar.
        // Reject a late height from the previous compact viewport after rotation.
        if (!mobileShell.matches && height < Math.min(756, available)) return;
        reportedHeight = height;
        fitFrame(available);
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
